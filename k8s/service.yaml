apiVersion: v1
kind: Service
metadata:
  name: star-cinema-frontend
spec:
  type: NodePort
  selector:
    app: star-cinema-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: star-cinema-backend
spec:
  type: ClusterIP
  selector:
    app: star-cinema-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
